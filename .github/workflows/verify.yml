# Verifies, on every push and PR, that this repository's claims hold:
#   1. the flattened deployed sources match their published sha256 checksums
#   2. the checked-in ABIs are exactly reproducible from those sources
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed-source checksums
        run: grep -v '^#' contracts/v3/DEPLOY_CHECKSUMS.txt | sha256sum -c -

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Rebuild canonical ABI from the deployed source
        run: |
          forge build --contracts contracts/v3/flattened/ethereum --out out-eth
          python3 - <<'EOF'
          import json
          rebuilt = json.load(open('out-eth/ForeverLibraryV3_flat.sol/ForeverLibraryV3.json'))['abi']
          shipped = json.load(open('abi/ForeverLibraryV3.json'))
          assert rebuilt == shipped, 'abi/ForeverLibraryV3.json does not match a rebuild from source'
          print(f'canonical ABI reproducible ({len(shipped)} entries)')
          EOF

      - name: Rebuild Shape ABI from the deployed source
        run: |
          forge build --contracts contracts/v3/flattened/shape --out out-shape
          python3 - <<'EOF'
          import json
          rebuilt = json.load(open('out-shape/ForeverLibraryV3_flat.sol/ForeverLibraryV3.json'))['abi']
          shipped = json.load(open('abi/ForeverLibraryV3.shape.json'))
          assert rebuilt == shipped, 'abi/ForeverLibraryV3.shape.json does not match a rebuild from source'
          print(f'shape ABI reproducible ({len(shipped)} entries)')
          EOF
