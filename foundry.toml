# Canonical ForeverLibraryV3 + its full test suite.
# The Shape variant is its own project: contracts/v3/shape (cd there, forge test).
[profile.default]
src = "contracts/v3"
test = "contracts/v3/test"
out = "out"
libs = ["lib"]
skip = ["contracts/v3/flattened/**", "contracts/v3/shape/**"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# ABI-reproducibility builds of the per-chain flattened deployed sources
# (used by CI and INTEGRATION.md §3): FOUNDRY_PROFILE=flattened forge build ...
[profile.flattened]
src = "contracts/v3/flattened"
skip = []
out = "out-flat"
